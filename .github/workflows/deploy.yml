name: Build and deploy admin

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE:             ${{ github.ref_name == 'main' && vars.VITE_API_BASE || vars.VITE_API_BASE_DEV }}
          VITE_FIREBASE_API_KEY:     ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:  ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID:      ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_BASE:                 /
        run: npm run build

      # Create the CF Pages project on first deploy. Idempotent: exits 0 if it
      # already exists. Runs before the deploy step so a fresh env self-heals.
      - name: Ensure Cloudflare Pages project exists
        env:
          CF_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          HTTP=$(curl -s -o /tmp/cf.json -w "%{http_code}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/fg-collect-admin")
          if [ "$HTTP" = "200" ]; then
            echo "Project fg-collect-admin already exists."
            exit 0
          fi
          echo "Project not found (HTTP $HTTP), creating..."
          curl -sf -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"fg-collect-admin","production_branch":"main"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects" \
            > /tmp/cf-create.json
          echo "Created:"
          cat /tmp/cf-create.json | head -c 500

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fg-collect-admin --branch=${{ github.ref_name }}
