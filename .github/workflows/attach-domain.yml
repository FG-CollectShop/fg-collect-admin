name: One-shot — attach admin.futuregadgetlabs.com to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attach-domain:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN:        admin.futuregadgetlabs.com
      PROJECT:       fg-collect-admin
    steps:
      - name: Attach custom domain to Pages project
        run: |
          HTTP=$(curl -s -o /tmp/att.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$DOMAIN\"}" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/domains")
          echo "HTTP $HTTP:"
          cat /tmp/att.json | python3 -m json.tool || cat /tmp/att.json
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ] && [ "$HTTP" != "409" ]; then
            exit 1
          fi

      - name: List attached domains
        run: |
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            | python3 -m json.tool
